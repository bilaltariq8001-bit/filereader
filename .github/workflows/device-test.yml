name: Device test
on:
  workflow_dispatch:
  push:
    branches: [fix/stability-and-performance]
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
      - run: rm -rf android/.gradle android/build build .dart_tool
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-x64
      - run: pip install python-docx python-pptx openpyxl pillow reportlab pypdf && python3 .github/scripts/make_samples.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb push samples/. /sdcard/
            adb shell "find /sdcard/Download/archive -type f -exec touch -t 202501010000 {} +"
            adb shell ls -R /sdcard/Documents /sdcard/Download | head -60
            adb logcat -c
            python3 .github/scripts/device_smoke.py 2>&1 | tee smoke.log
