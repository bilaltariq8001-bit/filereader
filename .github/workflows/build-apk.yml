name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [fix/stability-and-performance]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
      - run: rm -rf android/.gradle android/build build .dart_tool
      - run: flutter pub get
      # One APK per CPU type: arm64 fits almost every phone from 2017 on,
      # armeabi-v7a is for older 32-bit phones.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm
      - run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk pdf-reader-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk pdf-reader-armv7.apk
          ls -l pdf-reader-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-apk
          path: pdf-reader-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: PDF Reader test build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            pdf-reader-arm64.apk
            pdf-reader-armv7.apk
